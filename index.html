<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>体检前健康问卷 · 界面预览</title>
<style>
:root {
  color-scheme: light;
  --ink: #242422;
  --muted: #52524f;
  --subtle: #62625d;
  --canvas: #fff;
  --line: #eae9e5;
  --accent: #2c2d28;
  --selection: #f1f0eb;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font: 16px/1.65 "SimSun", "Songti SC", "Noto Serif CJK SC", serif;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
header { border-bottom: 1px solid var(--line); }
.top {
  width: min(100% - 48px, 1120px);
  margin-inline: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  min-height: 64px;
}
.brand { font-size: 14px; font-weight: 700; }
.text-button {
  padding: 6px 0;
  background: none;
  border: 0;
  color: var(--accent);
  white-space: nowrap;
  text-underline-offset: 4px;
}
.text-button:hover { text-decoration: underline; }
.shell { width: min(100% - 48px, 648px); margin: 0 auto; padding: 54px 0 64px; }
.intro { text-align: center; margin-bottom: 43px; }
h1 { font-size: clamp(34px, 5vw, 51px); letter-spacing: .025em; line-height: 1.25; margin: 0 0 14px; }
.intro.compact { margin-bottom: 16px; }
.intro.compact h1 { font-size: 23px; margin: 0; }
.intro p { margin: 0 auto; max-width: 37em; color: var(--muted); font-size: 15px; line-height: 1.85; text-wrap: pretty; }
.card { padding: 0 clamp(0px, 4vw, 25px) 12px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
h2 { margin: 0; font-size: 24px; line-height: 1.4; }
small { color: var(--subtle); font-size: 13px; }
#progress { font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { height: 3px; background: #efeeeb; border-radius: 4px; margin-bottom: 23px; overflow: hidden; }
.bar div { height: inherit; background: var(--accent); border-radius: inherit; transition: width .32s cubic-bezier(.22,.7,.25,1); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 19px 20px; }
.grid > label, legend { font-weight: 700; }
.follow-up .grid { margin: 0; }
.follow-up > label { display: block; max-width: 540px; }
.follow-up .help { margin-top: 6px; }
.form-error { margin: 14px 0 0; color: #9c342a; font-size: 14px; }
.field {
  display: flex;
  align-items: center;
  min-height: 46px;
  background: #f8f7f5;
  border: 1px solid #ecebe7;
  border-radius: 11px;
  gap: 10px;
  padding: 0 12px;
  margin-top: 6px;
}
.field:focus-within { border-color: #88877e; background: #fff; }
.field input { background: transparent; border: 0; width: 100%; min-width: 0; padding: 8px 0; outline: 0; }
.field small { white-space: nowrap; }
fieldset { border: 0; padding: 0; min-width: 0; margin: 0; }
fieldset + fieldset, .follow-up { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 17px; }
legend { padding: 0; margin-bottom: 5px; }
fieldset + fieldset legend, .follow-up legend { float: left; width: 100%; }
fieldset + fieldset .choices, .follow-up .choices { clear: both; }
.help { font-size: 14px; color: var(--muted); margin: 0 0 6px; }
.choices { display: grid; }
.choice { display: flex; align-items: center; gap: 10px; min-height: 43px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.choice input { accent-color: var(--accent); margin: 0; flex: none; width: 16px; height: 16px; }
.choice:hover { background: #f8f7f5; }
.choice:has(:checked) { color: var(--accent); background: var(--selection); }
.grid fieldset legend { margin-bottom: 6px; }
.grid .choices { grid-template-columns: 1fr 1fr; gap: 6px; }
.grid .choice { min-height: 46px; justify-content: center; border: 1px solid #ecebe7; }
.grid .choice:has(:checked) { border-color: #b8b6ab; }
.actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 18px; margin-top: 23px; }
.primary { margin-left: auto; border: 0; background: var(--accent); color: #fff; border-radius: 11px; padding: 9px 24px; min-height: 44px; transition: transform .16s ease, background .16s ease; }
.primary:hover { background: #11120f; }
.primary:active { transform: scale(.98); }
:focus-visible { outline: 2px solid #757369; outline-offset: 3px; }
h1:focus, h2:focus { outline: none; }
.report-title { text-align: center; margin-bottom: 26px; }
.report-title h2 { font-size: clamp(30px, 5vw, 42px); margin: 6px 0; }
.reportintro { margin: 0; color: var(--muted); }
.question-preview > h2 { font-size: clamp(27px, 5vw, 37px); margin-bottom: 8px; }
.preview-section { margin: 25px 0; padding-top: 18px; border-top: 1px solid var(--line); }
.preview-section > h3 { font-size: 19px; margin: 0 0 17px; }
.preview-condition { color: var(--muted); font-size: 14px; margin: 10px 0 8px; }
.question-preview .choice, .question-preview input { cursor: default; }
.question-preview .choice:hover { background: transparent; }
.question-preview input:disabled { opacity: .8; }
.report-block { padding-block: 16px 14px; border-top: 1px solid var(--line); }
.report-block h3 { font-size: 18px; margin: 0 0 7px; }
.report-block p { margin: 6px 0; }
.bmi { color: var(--accent); font-size: 29px; font-weight: 700; font-variant-numeric: tabular-nums; }
.reportnote { color: var(--muted); font-size: 14px; }
[hidden] { display: none !important; }
@media (max-width: 520px) {
  .top { width: calc(100% - 32px); min-height: 54px; }
  .brand { font-size: 12px; }
  .top .text-button { font-size: 13px; }
  .shell { width: calc(100% - 28px); padding-block: 28px 32px; }
  .intro { margin: 0 8px 21px; }
  .intro.compact { margin-bottom: 16px; }
.intro.compact h1 { font-size: 23px; margin: 0; }
.intro p { font-size: 14px; }
  .card { padding: 0 clamp(0px, 4vw, 25px) 12px; }
  .grid { column-gap: 11px; }
  .grid .choice { gap: 5px; padding-inline: 4px; }
}
@media (max-width: 355px) { .grid { grid-template-columns: 1fr; } }
.stage-forward { animation: arrive .29s cubic-bezier(.22,.7,.25,1) both; }
.stage-backward { --stage-offset: -9px; animation: arrive .29s cubic-bezier(.22,.7,.25,1) both; }
@keyframes arrive { from { opacity: 0; transform: translateX(var(--stage-offset, 9px)); } to { opacity: 1; transform: translateX(0); } }
.question-reveal { animation: reveal .22s ease-out both; }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) {
  .bar div, .primary { transition: none; }
  .stage-forward, .stage-backward, .question-reveal { animation: none; }
}
</style>
<header><div class="top"><div class="brand">安徽医科大学第一附属医院健康管理中心</div><button id="preview-toggle" type="button" class="text-button" aria-controls="question-preview" aria-expanded="false">预览题目</button></div></header>
<main class="shell">
<section class="intro" id="intro"><h1>体检前健康问卷</h1><p id="intro-copy">为完善健康体检服务，现需了解您的基本信息与个人健康史，以便形成更有针对性的体检建议。本问卷仅作为体检服务参考，不影响后续体检流程。感谢您的配合。</p></section>
<article class="card"><div id="intake"><div class="card-head"><h2 id="heading" tabindex="-1"></h2><small id="progress"></small></div><div class="bar" aria-hidden="true"><div id="bar"></div></div><form id="form"></form></div>
<section id="report" hidden>
<div class="report-title"><h2 tabindex="-1">您的体检建议</h2><p class="reportintro" id="report-profile"></p></div>
<div id="actual-report"></div>
<div class="actions"><button id="back" type="button" class="text-button">返回问卷</button></div></section>
<section id="question-preview" class="question-preview" hidden>
<h2 id="preview-heading" tabindex="-1">问卷题目预览</h2>
<p class="help">此处可浏览全部题目。标有显示条件的题目，只在正式填写时符合条件才会出现。</p>
<div id="preview-questions"></div>
<div class="actions"><button id="preview-back" type="button" class="primary">返回填写</button></div>
</section></article></main>
<script>
const byId=id=>document.getElementById(id);
const sections=['基本信息','个人病史、吸烟与饮酒','日常活动与饮食','既往专项检查与近期变化','家族史与体检记录'];
const data={};let current=0;
const options=(key,title,list,multi=false,help='',required=true)=>'<fieldset'+(multi&&required?' data-required-group':'')+'><legend>'+title+'</legend>'+(help?'<p class="help">'+help+'</p>':'')+'<div class="choices">'+list.map((value,i)=>'<label class="choice"><input type="'+(multi?'checkbox':'radio')+'" name="'+key+'" value="'+i+'"'+(!multi&&required?' required':'')+'> '+value+'</label>').join('')+'</div></fieldset>';
const field=(key,label,unit)=>'<label>'+label+'<span class="field"><input type="number" required min="1" step="'+(key==='age'?'1':'0.1')+'" name="'+key+'" placeholder="请输入"><small>'+unit+'</small></span></label>';
const numberDetail=(key,label,unit,min,max,step=1)=>'<label>'+label+'<span class="field"><input type="number" name="'+key+'" min="'+min+'" max="'+max+'" step="'+step+'" inputmode="decimal" placeholder="请输入" required><small>'+unit+'</small></span></label>';
const smokeDetails=()=>'<div id="smoke-details" class="follow-up" hidden><div class="grid">'+numberDetail('smokeDaily','吸烟时，平均每天吸几支？','支',0.01,200,0.01)+numberDetail('smokeYears','累计吸了多少年？','年',0,120,0.1)+'</div><div class="follow-up" id="quit-details" hidden>'+numberDetail('quitYears','已经戒烟多少年？','年',0,120,0.1)+'<p class="help">戒烟未满一年，可填写 0。</p></div><p class="help">平均每天不到 1 支，可填小数。例如一周约 3 支，可填 0.4。</p></div>';
const followUpDetails=()=>options('followup','以前体检或做其他检查时，有没有发现过异常？',['没有发现异常','有，发现过异常','以前没做过体检或相关检查'])+'<div id="followup-details" class="follow-up" hidden><label>请填写以前查出的异常项目<span class="field"><input name="followupName" required placeholder="例如肺结节、肠息肉、尿蛋白异常"></span></label>'+options('pendingReview','上述项目是否已到建议复查时间，且尚未复查？',['没有','有','不清楚'])+'</div>';
const screeningOptions=['未满 1 年','已满 1 年、不满 3 年','3 年或更久','从未做过','记不清'];
const womenScreening=()=>options('cervical','您上次做宫颈癌筛查是什么时候？',screeningOptions)+options('breast','您上次做乳腺癌筛查是什么时候？',screeningOptions);
const smoking=()=>options('smoke','您的吸烟情况是？',['不吸烟','现在吸烟（包括偶尔吸烟）','以前吸烟，现在已经戒了'])+smokeDetails();
const drinking=()=>options('drink','您平时多久喝一次酒？',['不喝酒或很少喝酒（每月 1 次或更少）','偶尔喝酒（每月超过 1 次，但平均每周不到 2 次）','经常喝酒（平均每周 2 次或更多）']);
const previewHint=text=>'<p class="preview-condition">'+text+'</p>';
const hasSmokeHistory=smoking=>['1','2'].includes(smoking);
const cooksOften=cooking=>['2','3'].includes(cooking);
const screens=[
 ()=>'<div class="grid">'+field('age','年龄','周岁')+options('sex','您的性别',['男','女'],false,'',true)+field('height','身高','厘米')+field('weight','体重','公斤')+'</div>',
 ()=>options('history','您以前是否被医生告知有以下疾病或检查异常？',['高血压','糖尿病','血脂异常（如高血脂）','冠心病','慢性肝病（如慢性乙肝、丙肝或肝硬化）','其他疾病或检查异常','以上均无'],true)
  +'<div id="other" class="follow-up" hidden><label>疾病或检查异常名称<span class="field"><input name="other" required placeholder="例如颈动脉斑块"></span></label></div>'
  +['降压','降糖'].map((drug,i)=>'<div id="med'+i+'" class="follow-up" hidden>'+options('med'+i,'您平时怎么用'+drug+'药？',['按医生交代的用法规律用药','平时按医嘱用药，偶尔忘记',(i?'血糖':'血压')+'正常时就不用，偏高时才用','目前没用'+drug+'药'])+'</div>').join('')
  +'<div class="follow-up">'+smoking()+'</div>'+drinking(),
 ()=>options('sit','您白天大部分时间是坐着还是站着？',['大部分时间坐着','大部分时间站着'])
  +options('exercise','过去一周，您有几天做过快走、骑车、游泳、跳操等运动？',['0 天','1–2 天','3–4 天','5–7 天'])
  +options('meal','您平时三餐吃得规律吗？',['三餐基本按时吃，很少有哪一顿不吃','偶尔不吃早餐，或偶尔晚饭时间不固定','经常不吃早餐，或经常晚饭时间不固定','工作日三餐基本按时吃，休息日吃饭时间不固定，或有时少吃一顿'],false,'如果主要是休息日吃饭不规律，请选最后一项。')
  +options('food','您的日常饮食有哪些情况？',['主食吃得较多，蔬菜水果或鱼、肉、蛋、奶、豆制品吃得较少','能搭配主食、蔬菜水果和鱼、肉、蛋、奶或豆制品','平时吃得比较油或比较咸，常吃油炸、烧烤或腌制食品'],true,'可多选。')
  +options('cooking','您平时每周有几天在家做饭？',['基本不做','每周 1–2 天','每周 3–6 天','每天都做']),
 (preview=false)=>(preview||Number(answer('age'))>=30?(preview?previewHint('满 30 岁时显示'):'')+options('scope','过去 5 年，您做过胃镜和肠镜吗？',['两项都做过','只做过胃镜','只做过肠镜','两项都没做过'],false,'',true):'')
  +options('symptom','最近有没有明显便血，或大便形状、排便情况明显改变？',['有','没有'],false,'例如排便比以前困难、新出现或明显加重的便秘、大便明显变细或变粗。',true)
  +(preview||hasSmokeHistory(answer('smoke'))||cooksOften(answer('cooking'))?(preview?previewHint('有吸烟史，或每周在家做饭至少 3 天时显示'):'')+options('chestCt','过去一年，您做过胸部 CT 吗？',['做过','没做过','记不清']):'')
  +(preview||(answer('sex')==='1'&&Number(answer('age'))>=18)?'<div class="follow-up">'+(preview?previewHint('成年女性显示'):'')+womenScreening()+'</div>':''),
 ()=>options('family','您的父母或兄弟姐妹中，有人被医生确诊过以下疾病吗？',['无','高血压','糖尿病','心血管疾病（如冠心病、心肌梗死）','癌症'],true,'部分疾病在同一家族中较为常见。本题仅用于提供健康体检建议。')
  +options('check','您上一次做健康体检是什么时候？',['未满 1 年','已满 1 年、不满 2 年','2 年或更久','从未做过健康体检','记不清'],false,'',true)
  +followUpDetails()
];
const form=byId('form');
function save(){const entries=new FormData(form);for(const el of form.elements)if(el.name)data[el.name]=entries.getAll(el.name);}
function setPanel(id,visible){
 const panel=byId(id);
 if(panel.hidden&&visible)panel.classList.add('question-reveal');
 panel.hidden=!visible;
 for(const input of panel.querySelectorAll('input'))input.disabled=Boolean(input.closest('[hidden]'));
}
function toggle(){
 const answers=new FormData(form);
 if(current===1){
  const diseases=answers.getAll('history');
  setPanel('other',diseases.includes('5'));
  for(const i of [0,1]){
   setPanel('med'+i,diseases.includes(String(i)));
  }
  const smoke=answers.get('smoke');
  setPanel('smoke-details',smoke==='1'||smoke==='2');
  setPanel('quit-details',smoke==='2');
 }
 if(current===4)setPanel('followup-details',answers.get('followup')==='1');
}
function draw(){
 byId('report').hidden=true;byId('intake').hidden=false;byId('intro').hidden=false;byId('intro-copy').hidden=current!==0;byId('intro').classList.toggle('compact',current!==0);byId('preview-toggle').hidden=false;
 byId('heading').textContent=sections[current];byId('progress').textContent='第 '+(current+1)+' 步，共 '+sections.length+' 步';byId('bar').style.width=(current+1)*20+'%';
 form.innerHTML=screens[current]()+'<p id="form-error" class="form-error" role="alert" hidden>请补全本页题目后再继续。</p><div class="actions">'+(current?'<button class="text-button" type="button" id="prev">上一步</button>':'')+'<button class="primary">'+(current===4?'查看体检建议':'下一步')+'</button></div>';
 for(const el of form.elements)if(data[el.name]){if(['radio','checkbox'].includes(el.type))el.checked=data[el.name].includes(el.value);else el.value=data[el.name][0]||'';}
 if(current)byId('prev').onclick=()=>go(current-1);
 toggle();
 syncValidity();
}
function animatePanel(el,direction){el.classList.remove('stage-forward','stage-backward');void el.offsetWidth;el.classList.add(direction);}
function go(n){save();const direction=n<current?'stage-backward':'stage-forward';current=n;draw();animatePanel(form,direction);byId('heading').focus({preventScroll:true});window.scrollTo(0,0);}
const first=(answers,key)=>answers[key]?.[0]||'';
const answer=key=>first(data,key);
function buildReport(answers){
 const value=key=>first(answers,key);
 const has=(key,choice)=>Boolean(answers[key]?.includes(choice));
 const age=Number(value('age'));
 const advancedAge=age>=80;
 const diabetes=has('history','1'), hypertension=has('history','0');
 const coronary=has('history','3'), lipid=has('history','2');
 const irregular=['2','3'].includes(value('meal'));
 const salty=has('food','2'), drinkOften=value('drink')==='2';
 const smoking=value('smoke');
 const smokeHistory=hasSmokeHistory(smoking);
 const cookingOften=cooksOften(value('cooking'));
 const splitNames=text=>text.split(/[、，,；;]+/).map(x=>x.trim()).filter(Boolean);
 const other=has('history','5')?splitNames(value('other')):[];
 const previous=value('followup')==='1'?[...new Set(splitNames(value('followupName')))]:[];
 const known=new Set([...other,...previous]);
 const lungCancerName=name=>/^(?:(?:既往|已|曾)?确诊|既往患有|曾患)?(?:肺癌|肺腺癌|肺鳞癌|小细胞肺癌|非小细胞肺癌)(?:病史|术后(?:复查)?|手术后|治疗后|[（(](?:术后|已手术|治疗后)[）)])?$/.test(name);
 const lungCancer=[...known].filter(lungCancerName);
 const rightTime=value('followup')==='1'&&has('pendingReview','1');
 const bowelPolyp=name=>/^(结直肠息肉|结肠息肉|直肠息肉|肠息肉)$/.test(name);
 const stomachRisk=name=>/^(慢性)?萎缩性胃炎$/.test(name);
 const plaque=known.has('颈动脉斑块');
 const fattyLiver=known.has('脂肪肝');
 const liverRisk=drinkOften||lipid||fattyLiver||has('history','4');
 const vascularHabits=smoking==='1'||['1','2'].includes(value('drink'))||salty;
 const pressure=hypertension||coronary||plaque||vascularHabits||has('family','1')||has('family','3');
 const glucose=diabetes||has('family','2');
 const lipids=lipid||coronary||plaque||vascularHabits||has('family','3');
 const focus=[], bmiNotes=[], lifestyle=[], exams=[];
 if(lungCancer.length)focus.push('既往肺癌病史。您填写了'+lungCancer.join('、')+'，请本次重点说明既往诊疗和最近一次复查情况。如有既往影像、病理报告或出院记录，可带来对照。');
 const otherPrior=previous.filter(name=>!lungCancerName(name));
 if(otherPrior.length||(!previous.length&&value('followup')==='1')){
  const names=otherPrior.length?'（'+otherPrior.join('、')+'）':'';
  focus.push('既往异常。请重点关注以前查出的异常项目'+names+'。如本次有对应检查，可对照前后结果。');
 }
 if(advancedAge)focus.push('高龄体检。您今年 '+age+' 岁，本次建议重点关注行走是否稳当、起身和上下台阶是否费力。近期如有跌倒、走路不稳或起身时头晕，可以在体检时主动说明，便于评估跌倒风险。');
 if(pressure)focus.push('血压。请关注本次血压结果。首次测量偏高时，可休息后复测。');
 if(diabetes)focus.push('血糖。'+(irregular?'您平时进餐时间也不固定。':'')+'请重点关注本次空腹血糖和糖化血红蛋白结果。若结果高于您的控制目标，可在体检后携带报告到内分泌科复诊。');
 else if(glucose)focus.push('空腹血糖。您有糖尿病家族史，请关注本次空腹血糖结果。');
 if(lipids)focus.push('血脂。请关注本次血脂结果，尤其是低密度脂蛋白胆固醇。'+(plaque?'您曾查出颈动脉斑块，也请留意高密度脂蛋白胆固醇。':'')+(coronary?'如已有心内科随访安排，可带上本次及既往报告。':''));

 const height=Number(value('height')), weight=Number(value('weight'));
 if(age>=18&&height>0&&weight>0){
  const bmi=Number((weight/(height/100)**2).toFixed(1));
  bmiNotes.push('您的体重指数（BMI）为 '+bmi.toFixed(1)+' kg/m²。');
  if(bmi>=18.5&&bmi<24)bmiNotes[0]+='您的 BMI 在成人正常范围内。';
  if(bmi<18.5)bmiNotes.push('您的体重偏轻。如果近期没有刻意减重，体重却持续下降，建议在本次体检时说明体重变化及持续时间。');
  if(bmi>=24){
   bmiNotes[0]+='（BMI 根据身高和体重计算，无法区分肌肉和脂肪。经常进行力量训练、肌肉量较高的人，BMI 可能偏高，可结合腰围或体成分检查结果综合评估。）';
   bmiNotes.push(bmi<28?'您的 BMI 处于超重范围，建议在本次体检中测量腰围。':'您的 BMI 达到成人肥胖判定界值，建议在本次体检中测量腰围，并结合相关检查结果评估健康风险。');
  }
 }
 if(advancedAge){
  lifestyle.push('预防跌倒和磕碰。建议穿合脚、防滑的鞋，保持家中通道畅通，夜间起身先开灯。浴室地面容易湿滑，可做好防滑；上下台阶时可扶稳扶手。');
  lifestyle.push('天气寒冷时注意保暖。早晚温差较大时及时添衣，外出时注意头颈和手脚保暖；雨雪天尽量避开湿滑或结冰的路面。');
 }
 const posture=value('sit'), exercise=value('exercise');
 const activity=['0','1'].includes(exercise)?'过去一周运动较少，可在身体条件允许时逐步增加步行等活动。':'';
 if(posture==='0')lifestyle.push('您白天以坐着为主，建议适时起身活动。'+activity);
 else if(posture==='1')lifestyle.push('您白天以站立为主，建议适当变换姿势并安排休息。'+activity);
 else if(activity)lifestyle.push(activity);
 if(smoking==='1')lifestyle.push('建议尽早戒烟。如果戒烟有困难，可向戒烟门诊咨询。');
 if(drinkOften)lifestyle.push('您平时饮酒较频繁，建议减少饮酒。');
 if(cookingOften)lifestyle.push('做饭时建议开启油烟机，保持厨房通风。');
 if(irregular)lifestyle.push('建议三餐按相对固定的时间进食。两餐间隔过长容易过度饥饿，也容易在下一餐吃得过多。可先从固定最容易错过的那一餐开始。');
 if(salty)lifestyle.push('建议减少油炸、腌制食品，烹调时适当少油少盐。');
 if(has('food','0'))lifestyle.push('建议适当搭配蔬菜水果和鱼、肉、蛋、奶或豆制品。');

 const last=value('check');
 if(age>55&&['2','3'].includes(last)){
  exams.push((last==='3'?'您此前未做过健康体检。':'您已两年或更久未做健康体检。')+'建议本次先完善基础体检项目，再结合既往检查结果和个人风险，安排以下适合您的检查。');
 }else if(age>=65&&last==='1'){
  exams.push('距离您上次健康体检已满一年。建议核对并完善本次基础体检项目。');
 }else if(age>=65&&last==='0'){
  exams.push('您近一年做过健康体检。建议对照近期结果，优先核对尚未完成或到期的复查项目。');
 }else if(age>55&&last==='4'){
  exams.push('建议先核对上次体检时间和检查项目，再安排本次需要完善的检查。');
 }
 if((age>55&&['2','3','4'].includes(last))||(age>=65&&last==='1')){
  const items=['血常规','尿常规',...(liverRisk?['肾功能']:['肝肾功能']),'心电图'];
  if(!liverRisk)items.push('腹部超声');
  if(!pressure)items.push('血压测量');
  if(!glucose)items.push('空腹血糖');
  if(!lipids)items.push('血脂');
  exams.push('基础项目。建议核对本次是否包含'+items.join('、')+'，优先完善适合您且尚未安排的项目。');
 }

 const scope=age>=30?value('scope'):'';
 const upperMissing=scope==='2'||scope==='3';
 const lowerMissing=scope==='1'||scope==='3';
 const upperPrior=[...known].some(stomachRisk), lowerPrior=[...known].some(bowelPolyp);
 const upperDue=rightTime&&previous.some(stomachRisk), lowerDue=rightTime&&previous.some(bowelPolyp);
 const changed=value('symptom')==='0';
 const scopeNotes=[];
 if(upperDue)scopeNotes.push('建议完善胃镜检查。您既往查出萎缩性胃炎，已到建议复查时间。请携带上次胃镜和病理报告（如有），便于对照胃黏膜变化。');
 else if(upperPrior)scopeNotes.push('胃镜。您既往查出萎缩性胃炎，建议对照上次胃镜报告和复查安排，核对本次是否需要完善胃镜检查。');
 else if(upperMissing)scopeNotes.push('胃镜。您过去 5 年未做胃镜，建议结合年龄、个人风险和既往检查记录，核对本次是否需要完善胃镜检查。');
 if(changed||lowerDue){
  const reason=changed?'您近期有便血或大便性状、排便情况明显改变。':'';
  const follow=lowerDue?'您曾查出结肠或直肠息肉，已到建议复查时间。':lowerPrior?'您曾查出肠息肉，请一并核对既往肠镜报告。':'';
  scopeNotes.push('建议完善肠镜检查。'+reason+follow+'如有既往肠镜和病理报告，可带来对照。');
 }else if(lowerPrior)scopeNotes.push('肠镜。您曾查出肠息肉，建议核对原报告的复查安排。');
 else if(lowerMissing)scopeNotes.push('肠镜。您过去 5 年未做肠镜，建议结合年龄、个人风险和既往检查记录，核对本次是否需要完善肠镜检查。');
 if(!scopeNotes.length&&age>=30)scopeNotes.push(scope==='0'?'胃镜和肠镜。您过去 5 年已做过两项检查，建议核对既往报告及复查时间。':'胃镜和肠镜。建议核对既往检查记录及复查时间。');
 exams.push(...scopeNotes);

 const quit=value('quitYears');
 const highRisk=age>=50&&age<=74&&Number(value('smokeDaily'))*Number(value('smokeYears'))/20>=20&&
  (smoking==='1'||(smoking==='2'&&quit!==''&&Number(quit)<15));
 if(lungCancer.length){
  exams.push('肺部复查。请按原诊疗团队的随访计划安排胸部检查，并核对下一次复查时间。');
 }else if(smokeHistory||cookingOften){
  const ct=value('chestCt');
  const oilFumes=cookingOften?'如经常接触较多厨房油烟，可在体检时一并说明。':'';
  if(ct==='0'){
   exams.push('胸部检查。您过去一年做过胸部 CT，建议先核对上次检查结果和复查时间，再确认本次是否需要复查。'+oilFumes);
  }else if(ct==='1'&&highRisk){
   exams.push('建议完善低剂量胸部 CT 检查。根据您填写的年龄和累计吸烟量，本次建议将这项检查纳入肺癌筛查。'+oilFumes);
  }else if(ct==='1'){
   const exposure=[smokeHistory?'有吸烟史':'',cookingOften?'每周在家做饭至少 3 天':''].filter(Boolean).join('，');
   exams.push('胸部检查。您'+exposure+'，建议结合年龄、吸烟史及油烟接触情况，评估是否适合低剂量胸部 CT 筛查。');
  }else{
   exams.push('胸部检查。建议先确认过去一年是否做过胸部 CT，再结合筛查条件和既往报告判断本次是否需要检查。'+oilFumes);
  }
 }
 if(liverRisk){
  const reasons=[fattyLiver?'既往查出脂肪肝':'',lipid?'有血脂异常':'',drinkOften?'饮酒较频繁':'',has('history','4')?'有慢性肝病史':''].filter(Boolean).join('、');
  exams.push('肝脏检查。您'+reasons+'。建议核对本次是否包含肝功能和腹部超声，如未包含，可根据既往结果完善相关检查；如已包含，请关注有无脂肪肝提示。');
 }
 if(plaque)exams.push('颈动脉检查。您曾查出颈动脉斑块，建议对照既往超声报告，核对颈动脉超声复查安排。');
 if(has('family','4'))exams.push('癌症筛查。您有癌症家族史，建议本次评估是否需要完善针对性筛查。');
 if(value('sex')==='1'&&age>=18){
  for(const [key,label] of [['cervical','宫颈癌筛查'],['breast','乳腺癌筛查']]){
   const record=value(key);
   if(record!=='')exams.push(label+'。'+(record==='3'?'您此前未做过该项筛查，建议结合年龄核对本次是否需要完善。':record==='4'?'既往记录暂不明确，建议核对本次筛查安排。':'建议对照既往筛查方式、结果和复查安排。'));
  }
 }
 const pendingOther=previous.filter(item=>!lungCancerName(item)&&!stomachRisk(item)&&!bowelPolyp(item)&&!['颈动脉斑块','脂肪肝'].includes(item));
 if(rightTime&&(!previous.length||pendingOther.length)){
  const names=pendingOther.length?'（'+pendingOther.join('、')+'）':'';
  exams.push('既往异常复查。您填写的项目'+names+'已到建议复查时间，请核对本次是否安排相应检查。');
 }
 if((changed||upperDue||lowerDue)&&scopeNotes.length)exams.push('若胃镜或肠镜提示需进一步诊治，请携带检查报告及病理结果（如有）到消化内科就诊。');
 return [['本次重点关注',focus],['BMI',bmiNotes],['生活建议',lifestyle],['体检建议',exams]].filter(([,notes])=>notes.length);
}
function renderReport(answers){
 const actual=byId('actual-report');
 actual.replaceChildren();
 const sections=buildReport(answers);
 if(!sections.length)sections.push(['本次体检建议',['请核对本次套餐的基础体检项目。']]);
 for(const [title,paragraphs] of sections){
  const section=document.createElement('section');
  section.className='report-block';
  const heading=document.createElement('h3');
  heading.textContent=title;
  section.append(heading);
  for(const text of paragraphs){
   const paragraph=document.createElement('p');
   paragraph.textContent=text;
   section.append(paragraph);
  }
  actual.append(section);
 }
}
function report(){
 save();
 byId('report-profile').textContent=[answer('age')+' 岁',{'0':'男','1':'女'}[answer('sex')]].join(' · ');
 renderReport(data);
 byId('intake').hidden=true;
 byId('intro').hidden=true;
 byId('preview-toggle').hidden=true;
 byId('report').hidden=false;
 animatePanel(byId('report'),'stage-forward');
 byId('report').querySelector('h2').focus({preventScroll:true});
 window.scrollTo(0,0);
}
const conditionalPreviewLabels={
 other:'选「其他疾病或检查异常」时显示',
 med0:'选「高血压」时显示',
 med1:'选「糖尿病」时显示',
 'smoke-details':'选「现在吸烟」或「以前吸烟，现在已经戒了」时显示',
 'quit-details':'选「以前吸烟，现在已经戒了」时显示',
 'followup-details':'选「有，发现过异常」时显示'
};
let scrollBeforePreview=0;
function togglePreview(show){
 const preview=byId('question-preview');
 const button=byId('preview-toggle');
 if(show){
  scrollBeforePreview=window.scrollY;
  const target=byId('preview-questions');
  target.replaceChildren();
  for(const [index,title] of sections.entries()){
   const section=document.createElement('section');
   section.className='preview-section';
   const heading=document.createElement('h3');
   heading.textContent=title;
   const content=document.createElement('div');
   content.innerHTML=screens[index](true);
   for(const panel of content.querySelectorAll('[id]')){
    const hint=conditionalPreviewLabels[panel.id];
    if(hint){
     panel.hidden=false;
     panel.insertAdjacentHTML('afterbegin',previewHint(hint));
    }
    panel.removeAttribute('id');
   }
   for(const input of content.querySelectorAll('input')){
    input.disabled=true;
    input.required=false;
   }
   section.append(heading,content);
   target.append(section);
  }
 }
 preview.hidden=!show;
 byId('intake').hidden=show;
 byId('intro').hidden=show;
 button.textContent=show?'返回填写':'预览题目';
 button.setAttribute('aria-expanded',String(show));
 byId(show?'preview-heading':'heading').focus({preventScroll:true});
 window.scrollTo(0,show?0:scrollBeforePreview);
}
function syncValidity(){
 for(const group of form.querySelectorAll('[data-required-group]')){
  const choices=[...group.querySelectorAll('input[type="checkbox"]:enabled')];
  if(choices.length)choices[0].setCustomValidity(choices.some(choice=>choice.checked)?'':'请至少选择一项。');
 }
 for(const input of form.querySelectorAll('input[type="text"][required]')){
  input.setCustomValidity(input.disabled||input.value.trim()?'':'请输入内容。');
 }
}
function refreshValidation(){
 byId('form-error').hidden=true;
 syncValidity();
}
form.oninput=refreshValidation;
form.onchange=event=>{
 const el=event.target;
 const exclusive={history:'6',family:'0'}[el.name];
 if(exclusive!==undefined&&el.checked){
  for(const other of form.elements[el.name]){
   if(other!==el&&(el.value===exclusive||other.value===exclusive))other.checked=false;
  }
 }
 toggle();
 refreshValidation();
};
form.addEventListener('invalid',()=>{byId('form-error').hidden=false;},true);
form.onsubmit=event=>{
 event.preventDefault();
 syncValidity();
 if(!form.reportValidity())return;
 if(current===sections.length-1)report();
 else go(current+1);
};
byId('preview-toggle').onclick=()=>togglePreview(byId('question-preview').hidden);
byId('preview-back').onclick=()=>togglePreview(false);
byId('back').onclick=()=>{draw();byId('heading').focus();window.scrollTo(0,0);};draw();
</script></html>
